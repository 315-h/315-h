<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设置与关于 · 缓择星球</title>
  <meta name="description" content="主题切换、数据清理、关于产品与隐私说明。" />
  <link rel="stylesheet" href="assets/css/theme.css" />
</head>
<body>

  <!-- 顶部导航 -->
  <div id="nav-mount"></div>

  <!-- 设置与关于主区 -->
  <main class="container page-hero">
    <section class="section settings-card">
      <h1>设置与关于</h1>
      <p class="lead" style="margin:12px 0 32px;">主题 · 数据 · 关于</p>

      <div class="card settings-list">
        <div class="settings-row">
          <div><div class="lbl">外观模式</div><div class="desc">自动跟随系统 / 锁定浅色 / 锁定深色，选择保存在本机</div></div>
          <div class="ctr theme-opts">
            <button class="btn btn-ghost theme-opt" id="theme-auto" style="height:34px;padding:0 16px;font-size:12px;">自动</button>
            <button class="btn btn-ghost theme-opt" id="theme-light" style="height:34px;padding:0 16px;font-size:12px;">浅色</button>
            <button class="btn btn-ghost theme-opt" id="theme-dark" style="height:34px;padding:0 16px;font-size:12px;">深色</button>
          </div>
        </div>
        <div class="settings-row">
          <div><div class="lbl">演示数据</div><div class="desc">一键载入 16 条示例决策（跨 7 场景），快速预览历史星轨与决策洞察</div></div>
          <div class="ctr"><button class="btn btn-demo" id="load-demo" style="height:34px;padding:0 16px;font-size:12px;">载入示例数据</button></div>
        </div>
        <div class="settings-row">
          <div><div class="lbl">删除示例数据</div><div class="desc">仅移除演示数据（demo_001~016），不影响你真实记录的决策</div></div>
          <div class="ctr"><button class="btn btn-ghost" id="remove-demo" style="height:34px;padding:0 16px;font-size:12px;">删除示例数据</button></div>
        </div>
        <div class="settings-row">
          <div><div class="lbl">清理星际尘埃</div><div class="desc">按类型 / 情景筛选历史星轨，批量清理冗余记录（保留主题偏好）</div></div>
          <div class="ctr"><a class="btn btn-ghost" id="clear-data" href="cleanup.html" style="height:34px;padding:0 16px;font-size:12px;color:#A32D2D;">去清理</a></div>
        </div>
        <div class="settings-row about-row" id="about">
          <div><div class="lbl">关于缓择星球</div><div class="desc">版本 1.0 · 慢慢选 · 2026</div></div>
          <div class="ctr"><span class="planet planet-sm"></span></div>
        </div>
        <div class="settings-row about-row">
          <div><div class="lbl">隐私说明</div><div class="desc">你的决策记录仅保存在本机浏览器（localStorage），不上传服务器；AI 分析仅在当前会话调用。</div></div>
          <div class="ctr"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <p class="slogan">理性拆解选择，减少后悔抉择</p>
    <p>© 2026 缓择星球 · 慢慢选</p>
  </footer>

  <!-- 移动端底部导航 -->
  <div id="tabbar-mount"></div>

  <script src="assets/js/ui.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/seed.js"></script>
  <script src="assets/js/settings.js"></script>
</body>
</html>
