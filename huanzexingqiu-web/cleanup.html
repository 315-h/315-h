<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>清理星际尘埃 · 缓择星球</title>
  <meta name="description" content="按类型与情景筛选历史星轨，批量清理冗余记录。" />
  <link rel="stylesheet" href="assets/css/theme.css" />
</head>
<body>

  <!-- 顶部导航 -->
  <div id="nav-mount"></div>

  <!-- 主区 -->
  <main class="container page-hero cleanup-page">
    <section class="section">
      <h1>清理星际尘埃</h1>
      <p class="lead" style="margin:12px 0 28px;">按类型 / 情景筛选历史星轨，批量清理冗余记录，让星球内核更清爽。</p>

      <div class="cleanup-layout">
        <!-- 左：筛选 -->
        <aside class="cleanup-filters">
          <div class="mode-toggle" role="group" aria-label="勾选模式">
            <button type="button" class="mode-btn on" data-mode="auto">自动勾选</button>
            <button type="button" class="mode-btn" data-mode="manual">手动勾选</button>
          </div>

          <div class="filter-group">
            <div class="filter-group-title">按类型</div>
            <div class="chip-wrap" id="filter-type"></div>
          </div>
          <div class="filter-group">
            <div class="filter-group-title">按情景</div>
            <div class="chip-wrap" id="filter-scene"></div>
          </div>
          <p class="filter-hint" id="filter-hint"></p>
        </aside>

        <!-- 右：列表 -->
        <section class="cleanup-list">
          <div class="cleanup-list-head">
            <span id="list-count">0 条记录</span>
            <button type="button" class="link-btn" id="select-all-toggle">全选 / 反选</button>
          </div>
          <div class="cleanup-list-inner" id="cleanup-records"></div>
        </section>
      </div>
    </section>
  </main>

  <!-- 底部固定操作区 -->
  <div class="cleanup-bar">
    <button class="btn btn-danger-outline" id="clear-all">全部清理</button>
    <button class="btn btn-primary" id="clear-selected">清理选中 <span id="sel-count">0</span> 条</button>
    <button class="btn btn-ghost" id="cancel-back">取消返回</button>
  </div>

  <!-- 二次确认弹窗 -->
  <div class="modal-mask" id="confirm-mask" style="display:none;">
    <div class="modal-card confirm-card" role="dialog" aria-modal="true" aria-label="确认全部清理">
      <h3>确认全部清理？</h3>
      <p class="hint">将永久删除全部历史星轨、我的底线与提醒（保留主题偏好）。此操作<span style="color:var(--primary-btn);font-weight:500;">不可恢复</span>。</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="confirm-cancel">取消</button>
        <button class="btn btn-danger" id="confirm-ok">确认清理</button>
      </div>
    </div>
  </div>

  <!-- 页脚 -->
  <footer class="footer">
    <p class="slogan">理性拆解选择，减少后悔抉择</p>
    <p>© 2026 缓择星球 · 慢慢选</p>
  </footer>

  <!-- 移动端底部导航 -->
  <div id="tabbar-mount"></div>

  <script src="assets/js/ui.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/cleanup.js"></script>
</body>
</html>
