<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>历史星轨 · 缓择星球</title>
  <meta name="description" content="决策记录归档与复盘，回看每一次纠结与选择。" />
  <link rel="stylesheet" href="assets/css/theme.css" />
</head>
<body>

  <!-- 顶部导航 -->
  <div id="nav-mount"></div>

  <!-- 历史星轨主区 -->
  <main class="container page-hero">
    <section class="section">
      <div class="page-head">
        <div>
          <h1 class="page-title">历史星轨</h1>
          <p class="page-lead">决策记录归档与复盘 · 回看每一次纠结与选择</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-primary" id="hist-export">↓ 导出</button>
          <a class="btn btn-ghost" href="workspace.html">+ 新建抉择</a>
        </div>
      </div>

      <!-- 图表区：星轨总览 + 决策洞察 -->
      <div class="dash">
        <section class="orbit-overview" id="orbit-overview">
          <div class="panel-head">
            <span class="mod-label">星轨总览</span>
            <span class="dash-sub">累计 · 点亮 · 场景分布</span>
          </div>
          <div class="dash-body" id="orbit-body"></div>
        </section>

        <section class="insights" id="insights">
          <div class="panel-head">
            <span class="mod-label">决策洞察</span>
            <span class="dash-sub">趋势 · 复盘率 · 场景偏好</span>
          </div>
          <div class="dash-body" id="insights-body"></div>
        </section>
      </div>

      <!-- 筛选 + 记录流 -->
      <div class="history-layout">
        <aside class="panel filter-panel">
          <div class="panel-head">
            <span class="panel-title">筛选</span>
            <button class="btn btn-ghost btn-sm" id="filter-clear">清除</button>
          </div>
          <div class="filter-list" id="filter-list"></div>
        </aside>
        <div class="record-col">
          <div class="record-toolbar">
            <span class="record-count" id="record-count">共 <b>0</b> 条</span>
          </div>
          <div class="record-list" id="record-list"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- 详情抽屉 -->
  <div class="detail-mask" id="detail-mask"></div>
  <aside class="detail-panel" id="detail-panel" role="dialog" aria-modal="true" aria-label="决策详情">
    <button class="detail-close" id="detail-close" aria-label="关闭">×</button>
    <div class="detail-head">
      <button class="btn btn-ghost btn-sm detail-back" id="detail-back">← 返回</button>
    </div>
    <div id="detail-body"></div>
  </aside>

  <!-- 页脚 -->
  <footer class="footer">
    <p class="slogan">理性拆解选择，减少后悔抉择</p>
    <p>© 2026 缓择星球 · 慢慢选</p>
  </footer>

  <!-- 移动端底部导航 -->
  <div id="tabbar-mount"></div>

  <script src="assets/js/ui.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/seed.js"></script>
  <script src="assets/js/history.js"></script>
</body>
</html>
